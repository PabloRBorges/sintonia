<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3B1026">
<title>Sintonia — jogo de casais</title>
<style>
  :root {
    --bg: #FFF6F0; --card: #FFFFFF; --ink: #3B1026; --muted: #8A6B78; --line: #F0DCD6;
    --accent: #E8436E; --accent-ink: #FFFFFF; --ok: #0F7F68; --ok-bg: #E2F5EF; --no-bg: #F6ECEE;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  .wide #app { max-width: 860px; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 14px; }
  .brand { font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
  .brand i { color: var(--accent); font-style: normal; }
  .code { font: 700 14px/1 ui-monospace, Menlo, monospace; letter-spacing: .14em;
    background: var(--ink); color: #fff; padding: 7px 10px; border-radius: 8px; }
  h1 { font-size: 30px; line-height: 1.12; letter-spacing: -.03em; margin: 10px 0 8px; text-wrap: balance; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 10px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  .q { font-size: 26px; font-weight: 800; line-height: 1.15; letter-spacing: -.02em; margin: 4px 0 16px; text-wrap: balance; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  input, textarea { width: 100%; font: inherit; color: inherit; background: #fff; border: 1.5px solid var(--line);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  input:focus, textarea:focus, button:focus-visible { outline: 3px solid #F7B6C6; outline-offset: 1px; border-color: var(--accent); }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 14px 16px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); width: 100%; touch-action: manipulation; }
  button:active { transform: translateY(1px); }
  button.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  button.dark { background: var(--ink); }
  button.sm { width: auto; padding: 8px 12px; border-radius: 10px; font-size: 14px; }
  button.mini { width: 34px; height: 34px; padding: 0; border-radius: 10px; background: #fff; color: var(--ink);
    border: 1.5px solid var(--line); font-size: 18px; line-height: 1; flex: none; }
  .opts { display: grid; gap: 10px; }
  .opts button { font-size: 20px; padding: 20px 16px; background: #fff; color: var(--ink); border: 2px solid var(--ink); }
  .opts button:active { background: var(--ink); color: #fff; }
  .pick { font-size: 22px; font-weight: 800; background: var(--ink); color: #fff; border-radius: 14px; padding: 18px; text-align: center; margin-bottom: 12px; }
  .err { background: #FDE7EC; color: #9B1638; border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-weight: 600; }
  .board { list-style: none; margin: 0; padding: 0; }
  .board li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .board li:first-child { border-top: 0; }
  .pos { width: 26px; height: 26px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
  .cn { flex: 1; min-width: 0; }
  .cn b, .cn small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cn small { color: var(--muted); }
  .pts { font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
  .res { border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; background: var(--no-bg); }
  .res.ok { background: var(--ok-bg); }
  .res.mine { outline: 2px solid var(--ink); }
  .rh { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .tag { font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 99px; background: #fff; color: var(--muted); white-space: nowrap; }
  .ok .tag { background: var(--ok); color: #fff; }
  .ans { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; padding: 2px 0; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .t { flex: 1; min-width: 0; }
  .row .t small { display: block; color: var(--muted); }
  .used { opacity: .5; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; padding: 5px 10px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); }
  .chip.done { background: var(--ok-bg); border-color: transparent; color: var(--ok); font-weight: 600; }
  .chip button { all: unset; cursor: pointer; margin-left: 6px; color: var(--muted); font-weight: 700; padding: 0 2px; }
  #qr { width: 100%; max-width: 260px; margin: 0 auto 10px; }
  #qr svg { width: 100%; height: auto; display: block; border-radius: 12px; }
  .url { font: 600 13px/1.3 ui-monospace, Menlo, monospace; word-break: break-all; text-align: center; margin-bottom: 10px; }
  .grid { display: grid; gap: 14px; }
  .two { display: grid; grid-template-columns: 1fr 96px; gap: 10px; }
  .big { font-size: 44px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .center { text-align: center; }
  .off { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: #fff; text-align: center; padding: 8px; font-size: 13px; }
  @media (min-width: 800px) { .wide .grid { grid-template-columns: 1fr 1fr; align-items: start; } }
  @media (prefers-reduced-motion: no-preference) { .res, .pick { animation: pop .25s ease-out; } }
  @keyframes pop { from { transform: scale(.97); opacity: 0; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="/qrcode.js"></script>
<script>
(function () {
  var $app = document.getElementById('app');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var parts = location.pathname.split('/').filter(Boolean);
  var mode = parts[0] === 'admin' ? 'admin' : parts[0] === 'j' ? 'player' : 'home';
  var code = (parts[1] || '').toUpperCase();
  var S = null, err = '', lastHtml = null, online = true, dead = '', busy = false, es = null;
  var ui = { qr: true, reset: false };
  var token = '', pid = '';
  if (mode === 'admin') {
    token = location.hash.slice(1) || store.get('adm_' + code) || '';
    if (token) store.set('adm_' + code, token);
    document.documentElement.classList.add('wide');
  }
  if (mode === 'player') pid = store.get('pid_' + code) || '';

  function api(path, data) {
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data || {}) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || 'Algo deu errado.'); return j; }); });
  }
  function act(p) {
    if (busy) return; busy = true; err = '';
    return p.catch(function (e) { err = e.message || 'Sem conexão.'; })
      .then(function () { busy = false; lastHtml = null; render(); });
  }
  function admin(action, extra) {
    var b = { token: token, action: action }; for (var k in (extra || {})) b[k] = extra[k];
    return act(api('/api/rooms/' + code + '/admin', b));
  }

  function connect() {
    if (es) es.close();
    var q = mode === 'admin' ? 'token=' + encodeURIComponent(token) : 'pid=' + encodeURIComponent(pid);
    es = new EventSource('/api/rooms/' + code + '/events?' + q);
    es.onmessage = function (e) { S = JSON.parse(e.data); online = true; render(); };
    es.onerror = function () {
      online = false;
      if (es.readyState === 2) {
        fetch('/api/rooms/' + code + (mode === 'admin' ? '?token=' + encodeURIComponent(token) : ''))
          .then(function (r) { return r.json().then(function (j) {
            if (r.status === 404) dead = 'Esse jogo não existe ou já foi encerrado.';
            else if (mode === 'admin' && !j.admin) dead = 'Este link de admin não é válido para o jogo ' + code + '.';
            else setTimeout(connect, 2000);
            render();
          }); }).catch(function () { setTimeout(connect, 3000); });
      }
      render();
    };
  }

  /* ---------- pedaços de tela ---------- */
  function top() {
    return '<header class="top"><a class="brand" href="/" style="text-decoration:none;color:inherit">Sin<i>tonia</i></a>' +
      (code ? '<span class="code" aria-label="Código do jogo">' + esc(code) + '</span>' : '') + '</header>';
  }
  function errBox() { return err ? '<div class="err" role="alert">' + esc(err) + '</div>' : ''; }
  function board(isAdmin) {
    var cs = S.couples.slice().sort(function (a, b) { return b.score - a.score; });
    if (!cs.length) return '<p class="muted">Nenhum casal entrou ainda.</p>';
    return '<ol class="board">' + cs.map(function (c, i) {
      var names = c.members.map(function (m) { return esc(m.name); }).join(' &amp; ');
      return '<li><span class="pos">' + (i + 1) + '</span><span class="cn"><b>' + esc(c.name) + '</b><small>' + names +
        (c.members.length < 2 ? ' · falta o par' : '') + '</small></span>' +
        (isAdmin ? '<button class="mini" data-act="adj" data-id="' + c.id + '" data-d="-1" aria-label="Tirar 1 ponto de ' + esc(c.name) + '">−</button>' : '') +
        '<span class="pts">' + c.score + '</span>' +
        (isAdmin ? '<button class="mini" data-act="adj" data-id="' + c.id + '" data-d="1" aria-label="Dar 1 ponto para ' + esc(c.name) + '">+</button>' : '') + '</li>';
    }).join('') + '</ol>';
  }
  function results(myCouple) {
    var o = S.question.options;
    var cs = S.couples.slice().sort(function (a, b) { return (b.id === myCouple) - (a.id === myCouple); });
    return cs.map(function (c) {
      var aw = S.awarded[c.id] || 0;
      return '<div class="res ' + (aw ? 'ok' : 'no') + (c.id === myCouple ? ' mine' : '') + '"><div class="rh"><b>' + esc(c.name) +
        '</b><span class="tag">' + (aw ? 'Combinou · +' + aw : 'Não pontuou') + '</span></div>' +
        c.members.map(function (m) {
          var a = S.answers[m.id];
          return '<div class="ans"><span>' + esc(m.name) + '</span><b>' + (a != null ? esc(o[a]) : 'sem resposta') + '</b></div>';
        }).join('') + '</div>';
    }).join('');
  }

  /* ---------- telas ---------- */
  function homeView() {
    return top() + '<h1>Vocês pensam igual?</h1><p class="muted">Cada um responde no seu celular. Resposta igual à do par vale ponto.</p>' + errBox() +
      '<div class="card"><h2>Vou conduzir o jogo</h2><button data-act="create">Criar um jogo</button></div>' +
      '<div class="card"><h2>Vou jogar</h2><label for="jcode">Código do jogo</label>' +
      '<input id="jcode" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="Ex.: K7QM">' +
      '<button class="dark" data-act="gojoin">Entrar</button></div>';
  }

  function playerView() {
    var h = top();
    if (!S.me) {
      var open = S.couples.filter(function (c) { return c.members.length === 1; });
      h += '<h1>Entre no jogo</h1>' + errBox() + '<div class="card"><label for="pname">Seu nome</label>' +
        '<input id="pname" maxlength="24" autocomplete="given-name" placeholder="Como te chamam">';
      if (open.length) h += '<h2>Seu par já entrou?</h2>' + open.map(function (c) {
        return '<div class="row"><span class="t"><b>' + esc(c.name) + '</b><small>com ' + esc(c.members[0].name) + '</small></span>' +
          '<button class="sm" data-act="joinc" data-id="' + c.id + '">Sou o par</button></div>'; }).join('') +
        '<h2 style="margin-top:16px">Ou crie o casal</h2>';
      h += '<label for="cname">Nome do casal</label><input id="cname" maxlength="30" placeholder="Ex.: Ana &amp; Leo">' +
        '<button data-act="joinnew">Criar casal e entrar</button></div>';
      return h;
    }
    var mine = S.couples.filter(function (c) { return c.id === S.me.coupleId; })[0] || { name: '', members: [], score: 0 };
    var partner = mine.members.filter(function (m) { return m.id !== S.me.id; })[0];
    h += errBox();
    if (S.phase === 'lobby') {
      h += '<div class="card center"><h2>' + esc(mine.name) + '</h2><p class="big">' + mine.score + '</p><p class="muted">ponto' + (mine.score === 1 ? '' : 's') + '</p>' +
        '<p>' + (partner ? 'Você e ' + esc(partner.name) + ' estão prontos. Aguardem a próxima pergunta.' :
          'Falta seu par entrar. Peça para escanear o QR Code e tocar em “Sou o par”.') + '</p></div>';
    } else if (S.phase === 'question') {
      h += '<div class="card"><h2>Pergunta ' + S.round + ' · vale ' + S.question.points + '</h2><p class="q">' + esc(S.question.text) + '</p>';
      if (S.myAnswer == null) h += '<div class="opts">' + S.question.options.map(function (o, i) {
        return '<button data-act="answer" data-i="' + i + '">' + esc(o) + '</button>'; }).join('') + '</div>';
      else h += '<div class="pick">' + esc(S.question.options[S.myAnswer]) + '</div><p class="muted center">Resposta enviada. ' +
        (partner ? (partner.answered ? esc(partner.name) + ' também já respondeu.' : 'Esperando ' + esc(partner.name) + ' responder.') : '') +
        ' O resultado aparece quando o apresentador revelar.</p>';
      h += '</div>';
    } else {
      var aw = S.awarded[mine.id] || 0;
      h += '<div class="card"><h2>Pergunta ' + S.round + '</h2><p class="q">' + esc(S.question.text) + '</p>' +
        '<p class="pick" style="background:' + (aw ? 'var(--ok)' : 'var(--ink)') + '">' + (aw ? 'Combinou! +' + aw : 'Não combinou desta vez') + '</p>' +
        results(mine.id) + '</div>';
    }
    h += '<div class="card"><h2>Placar</h2>' + board(false) + '</div>';
    return h;
  }

  function adminView() {
    var joinUrl = location.origin + '/j/' + code;
    var total = 0, done = 0;
    S.couples.forEach(function (c) { c.members.forEach(function (m) { total++; if (m.answered) done++; }); });
    var h = top() + errBox() + '<div class="grid"><div>';

    if (S.phase === 'lobby') {
      h += '<div class="card"><h2>Perguntas</h2>' + (S.bank.length ? S.bank.map(function (q, i) {
        return '<div class="row' + (q.used ? ' used' : '') + '"><span class="t"><b>' + esc(q.text) + '</b><small>' + q.options.map(esc).join(' / ') +
          ' · vale ' + q.points + (q.used ? ' · já usada' : '') + '</small></span>' +
          '<button class="sm" data-act="ask" data-i="' + i + '">Disparar</button>' +
          '<button class="mini" data-act="delq" data-i="' + i + '" aria-label="Apagar pergunta">×</button></div>'; }).join('') :
        '<p class="muted">Nenhuma pergunta. Adicione uma abaixo.</p>') + '</div>' +
        '<div class="card"><h2>Nova pergunta</h2><label for="qtext">Pergunta</label><textarea id="qtext" rows="2" maxlength="200" placeholder="Ex.: A gente casaria de novo?"></textarea>' +
        '<div class="two"><div><label for="qopts">Respostas, separadas por vírgula</label><input id="qopts" placeholder="Sim, Não"></div>' +
        '<div><label for="qpts">Pontos</label><input id="qpts" type="number" inputmode="numeric" min="1" value="1"></div></div>' +
        '<div style="display:flex;gap:10px"><button class="ghost" data-act="addq">Guardar na lista</button><button data-act="asknow">Disparar agora</button></div></div>';
    } else if (S.phase === 'question') {
      h += '<div class="card"><h2>Pergunta ' + S.round + ' · vale ' + S.question.points + '</h2><p class="q">' + esc(S.question.text) + '</p>' +
        '<p class="muted">' + S.question.options.map(esc).join(' / ') + '</p>' +
        '<p><b>' + done + ' de ' + total + '</b> responderam</p>' +
        S.couples.map(function (c) { return '<div class="row"><span class="t"><b>' + esc(c.name) + '</b></span><span class="chips">' +
          c.members.map(function (m) { return '<span class="chip' + (m.answered ? ' done' : '') + '">' + esc(m.name) + (m.answered ? ' ✓' : ' …') + '</span>'; }).join('') +
          '</span></div>'; }).join('') +
        '<button style="margin-top:14px" data-act="reveal">Revelar respostas e pontuar</button>' +
        '<button class="ghost" style="margin-top:8px" data-act="next">Cancelar pergunta</button></div>';
    } else {
      h += '<div class="card"><h2>Resultado da pergunta ' + S.round + '</h2><p class="q">' + esc(S.question.text) + '</p>' + results(null) +
        '<button style="margin-top:6px" data-act="next">Próxima pergunta</button></div>';
    }

    h += '</div><div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">Entrada dos casais</h2>' +
      '<button class="sm ghost" data-act="qr">' + (ui.qr ? 'Esconder QR' : 'Mostrar QR') + '</button></div>' +
      (ui.qr ? '<div id="qr" data-url="' + esc(joinUrl) + '"></div>' : '') +
      '<div class="url">' + esc(joinUrl) + '</div><button class="sm ghost" style="width:100%" data-act="copy">Copiar link</button></div>' +
      '<div class="card"><h2>Placar</h2>' + board(true) + '</div>' +
      '<div class="card"><h2>Jogadores</h2>' + (S.couples.length ? S.couples.map(function (c) {
        return '<div class="row"><span class="t"><b>' + esc(c.name) + '</b></span><span class="chips">' + c.members.map(function (m) {
          return '<span class="chip">' + esc(m.name) + '<button data-act="kick" data-id="' + m.id + '" aria-label="Remover ' + esc(m.name) + '">×</button></span>'; }).join('') + '</span></div>'; }).join('') :
        '<p class="muted">Ninguém entrou ainda.</p>') +
      (ui.reset ? '<div style="display:flex;gap:10px;margin-top:12px"><button class="sm dark" data-act="resetyes">Zerar mesmo</button><button class="sm ghost" data-act="resetno">Manter</button></div>' :
        '<button class="sm ghost" style="margin-top:12px" data-act="reset">Zerar placar</button>') + '</div></div></div>';
    return h;
  }

  function view() {
    if (mode === 'home') return homeView();
    if (dead) return top() + '<div class="card"><p><b>' + esc(dead) + '</b></p><a href="/"><button class="dark">Voltar ao início</button></a></div>';
    if (!S) return top() + '<p class="muted">Conectando…</p>';
    return (mode === 'admin' ? adminView() : playerView()) + (online ? '' : '<div class="off" role="status">Sem conexão. Reconectando…</div>');
  }

  var qrCache = {};
  function render() {
    var html = view();
    if (html === lastHtml) return;
    var a = document.activeElement, fid = a && a.id && $app.contains(a) ? a.id : null, sel = null, vals = {};
    $app.querySelectorAll('input,textarea').forEach(function (i) { if (i.id) vals[i.id] = i.value; });
    if (fid) try { sel = [a.selectionStart, a.selectionEnd]; } catch (e) {}
    $app.innerHTML = html; lastHtml = html;
    for (var k in vals) { var el = document.getElementById(k); if (el) el.value = vals[k]; }
    if (fid) { var f = document.getElementById(fid); if (f) { f.focus(); try { if (sel && sel[0] != null) f.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
    var q = document.getElementById('qr');
    if (q && window.qrcode) {
      var u = q.getAttribute('data-url');
      if (!qrCache[u]) { var g = qrcode(0, 'M'); g.addData(u); g.make(); qrCache[u] = g.createSvgTag({ cellSize: 6, margin: 3, scalable: true }); }
      q.innerHTML = qrCache[u];
    }
  }
  var val = function (id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; };
  var clear = function (ids) { ids.forEach(function (id) { var e = document.getElementById(id); if (e) e.value = id === 'qpts' ? '1' : ''; }); };
  function newQ() { return { text: val('qtext'), options: val('qopts').split(',').map(function (s) { return s.trim(); }).filter(Boolean), points: Number(val('qpts')) || 1 }; }
  function join(body) {
    act(api('/api/rooms/' + code + '/join', body).then(function (j) { pid = j.pid; store.set('pid_' + code, pid); connect(); }));
  }

  $app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act'), i = Number(b.getAttribute('data-i')), id = b.getAttribute('data-id');
    if (a === 'create') act(api('/api/rooms').then(function (j) { store.set('adm_' + j.code, j.adminToken); location.href = '/admin/' + j.code + '#' + j.adminToken; }));
    else if (a === 'gojoin') { var c = val('jcode').toUpperCase(); if (/^[A-Z0-9]{4}$/.test(c)) location.href = '/j/' + c; else { err = 'O código tem 4 letras ou números.'; render(); } }
    else if (a === 'joinc') join({ name: val('pname'), coupleId: id });
    else if (a === 'joinnew') join({ name: val('pname'), coupleName: val('cname') });
    else if (a === 'answer') act(api('/api/rooms/' + code + '/answer', { pid: pid, choice: i }));
    else if (a === 'ask') admin('ask', { index: i });
    else if (a === 'asknow') { var q = newQ(); if (!q.text) { err = 'Escreva a pergunta.'; render(); } else admin('ask', q); }
    else if (a === 'addq') { var p = admin('addQ', newQ()); if (p) p.then(function () { if (!err) clear(['qtext', 'qopts', 'qpts']); }); }
    else if (a === 'delq') admin('delQ', { index: i });
    else if (a === 'reveal') admin('reveal');
    else if (a === 'next') admin('next');
    else if (a === 'adj') admin('adjust', { coupleId: id, delta: Number(b.getAttribute('data-d')) });
    else if (a === 'kick') admin('kick', { playerId: id });
    else if (a === 'qr') { ui.qr = !ui.qr; render(); }
    else if (a === 'reset') { ui.reset = true; render(); }
    else if (a === 'resetno') { ui.reset = false; render(); }
    else if (a === 'resetyes') { ui.reset = false; admin('resetScores'); }
    else if (a === 'copy') { var url = location.origin + '/j/' + code;
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { b.textContent = 'Link copiado'; }, function () { b.textContent = 'Copie o link acima'; }); }
  });
  $app.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
    var map = { jcode: 'gojoin', cname: 'joinnew' }, a = map[e.target.id];
    if (a) { e.preventDefault(); var btn = $app.querySelector('[data-act="' + a + '"]'); if (btn) btn.click(); }
  });

  render();
  if (mode === 'admin' && !token) { dead = 'Abra este jogo pelo link de admin recebido ao criá-lo.'; render(); }
  else if (mode !== 'home') connect();
})();
</script>
